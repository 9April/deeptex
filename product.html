<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails du Produit | ATELIER</title>
  <meta name="description" content="T-shirt oversized confectionné en coton peigné d'exception. Découvrez les détails, les matières et la coupe. Livraison 24/48h au Maroc.">
  
  <link rel="stylesheet" href="assets/css/base.css?v=4">
  <link rel="stylesheet" href="assets/css/components.css?v=4">
  <link rel="stylesheet" href="assets/css/pages.css?v=4">
  <link rel="stylesheet" href="assets/css/animations.css?v=4">
</head>
<body>

  <!-- Dynamic Header Container -->
  <div id="site-header-container"></div>

  <!-- Main PDP Content -->
  <main id="pdp-main-content">
    <div class="container section-spacing">
      
      <!-- 2-Column PDP Grid -->
      <div class="pdp-layout">
        
        <!-- Left: Image Gallery & Zoom -->
        <section class="pdp-gallery" id="pdp-gallery-container">
          <!-- Rendered dynamically by product.js -->
        </section>

        <!-- Right: Product Information & Purchase Controls -->
        <section class="pdp-info" id="pdp-info-container">
          <!-- Rendered dynamically by product.js -->
        </section>

      </div>

      <!-- Related / Recommended Products Section -->
      <section style="margin-top: clamp(60px, 8vw, 100px); padding-top: 48px; border-top: 1px solid var(--color-border);">
        <div class="section-header text-center">
          <span class="badge" style="background: var(--color-bg-secondary); color: var(--color-dark); margin-bottom: 8px;">COMPLÉTEZ VOTRE VESTIAIRE</span>
          <h2>VOUS AIMEREZ AUSSI</h2>
          <p class="section-subtitle">D'autres pièces conçues avec la même exigence de confection.</p>
        </div>

        <div class="product-grid-4col" id="pdp-related-grid">
          <!-- Rendered dynamically -->
        </div>
      </section>

    </div>
  </main>

  <!-- Dynamic Footer Container -->
  <div id="site-footer-container"></div>

  <!-- Core Scripts -->
  <script src="assets/js/config.js?v=12"></script>
  <script src="assets/js/i18n.js?v=12"></script>
  <script src="assets/js/data/categories.js?v=12"></script>
  <script src="assets/js/data/collections.js?v=12"></script>
  <script src="assets/js/data/products.js?v=12"></script>
  <script src="assets/js/core/storage.js?v=12"></script>
  <script src="assets/js/core/utils.js?v=12"></script>
  <script src="assets/js/core/cart.js?v=12"></script>
  <script src="assets/js/core/wishlist.js?v=12"></script>
  <script src="assets/js/core/search.js?v=12"></script>
  <script src="assets/js/components/toast.js?v=12"></script>
  <script src="assets/js/components/header.js?v=12"></script>
  <script src="assets/js/components/footer.js?v=12"></script>
  <script src="assets/js/components/productCard.js?v=12"></script>
  <script src="assets/js/components/cartDrawer.js?v=12"></script>
  <script src="assets/js/components/quickAddModal.js?v=12"></script>
  <script src="assets/js/components/sizeGuideModal.js?v=12"></script>
  <script src="assets/js/pages/product.js?v=12"></script>
</body>
</html>
